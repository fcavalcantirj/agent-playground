# Phase 19 production stack: postgres + api_server + caddy on the Hetzner box.
#
# Invariants:
#   - No public Postgres port (compose-internal only).
#   - caddy_data named volume persists ACME certs across container restarts (Pitfall 7).
#   - api_server mounts /var/run/docker.sock (D-08 accepted risk; see deploy/README.md).
#   - DOCKER_GID build arg is set by deploy/deploy.sh from `stat -c %g /var/run/docker.sock`.
#   - AP_ENV=prod gates /docs closed (D-10); AP_TRUSTED_PROXY=true because Caddy is in front.
#
# Deploy is via deploy/deploy.sh (pull → build → [BLOCKING] alembic upgrade head → roll).

services:
  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ap
      POSTGRES_DB: agent_playground_api
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets: [pg_password]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ap -d agent_playground_api"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    # Phase 22c.3 (D-08 + D-11): Redis Pub/Sub fan-out for inapp chat events.
    # Loopback-only inside the compose network — NO `ports:` block, so the
    # external host has no path to this service. Caddy is in front for
    # public ingress, not Redis. (D-08 hardening rule: never expose Redis
    # publicly; the bridge network IS the security boundary.)
    #
    # NOTE on protected-mode: Redis 7's `--protected-mode yes` is designed
    # for the case where Redis binds to 0.0.0.0 with no auth on a hostile
    # public network — it silently RST-closes any non-loopback client.
    # That semantic does NOT match this deploy: redis here lives on a
    # private compose bridge network, has no host port in the prod
    # compose, and api_server is the only client (which connects from
    # the bridge IP, not loopback). Leaving protected-mode on therefore
    # blocks the legitimate api_server connection (verified empirically
    # — `Connection reset by peer` from `redis.asyncio.from_url` calls).
    # Disabling it is correct because the security boundary is the
    # bridge network itself (D-08), not the per-process Redis flag.
    # Local override (deploy/docker-compose.local.yml) does expose
    # 127.0.0.1:6379 for host-venv tests, which is host-loopback-only
    # too, so still no public exposure.
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--protected-mode", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  temporal:
    # Phase 28 (D-01, D-02, D-03): self-hosted Temporal cluster, single
    # namespace `default`, Postgres backend pointing at the existing
    # `postgres` service. auto-setup bootstraps `temporal` and
    # `temporal_visibility` databases inside the same Postgres on first boot.
    # NO host-bound port for 7233 — internal-only. UI exposes 8088 below.
    #
    # Wave 0 finding (28-01-SPIKE-EVIDENCE.md): the temporalio/auto-setup:1.29.2
    # image only ships `config/dynamicconfig/docker.yaml` at runtime;
    # pointing DYNAMIC_CONFIG_FILE_PATH at `development-sql.yaml` (the path
    # quoted in upstream temporalio/docker-compose for older tags) crashes
    # the server at boot with "unable to validate dynamic config: stat ...:
    # no such file or directory". The correct path for 1.29.2 is `docker.yaml`.
    image: temporalio/auto-setup:1.29.2
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ap
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal-ui:
    # Phase 28 (D-03, D-16): web UI on 127.0.0.1:8088 (loopback only — never
    # publicly bind; ops access via SSH tunnel to the Hetzner box).
    image: temporalio/ui:2.40.0
    restart: always
    depends_on:
      temporal:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8088

  temporal-worker:
    # Phase 28 (D-04): worker process for the `ap-messages` task queue.
    # Same image as api_server — shared deps, separate `command` invoking
    # the worker entrypoint that lands in Plan 28-04. Inherits the same
    # env_file so DB pool + Redis + recipe dir are available.
    #
    # NOTE: until Plan 28-04 lands the `api_server.temporal.worker` module,
    # this container will restart-loop. That is EXPECTED for Wave 1 — the
    # cluster + UI come up green, the worker shell exists for Wave 2 to
    # consume.
    build:
      context: ..
      dockerfile: tools/Dockerfile.api
      args:
        DOCKER_GID: ${DOCKER_GID:-999}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    command: ["python", "-m", "api_server.temporal.worker"]
    # Phase B UAT (2026-05-09) — Docker Desktop on macOS exposes
    # /var/run/docker.sock inside the container as 0:0 mode 660 regardless
    # of host ownership. The Dockerfile-baked DOCKER_GID does not match.
    # Adding root-group membership gives apiuser socket access without
    # making the process itself root. On Linux deploys with stat-cgroupable
    # sockets this is a no-op (apiuser already has access via DOCKER_GID).
    group_add: ["0"]
    # The Dockerfile.api inherited HEALTHCHECK curls localhost:8000/healthz —
    # correct for api_server but bogus here (the worker is a Temporal SDK
    # process, no HTTP listener). Disable the inherited probe; worker health
    # surfaces via Temporal's own task-queue heartbeats.
    healthcheck:
      disable: true
    environment:
      AP_ENV: prod
      AP_RECIPES_DIR: /app/recipes
      AP_REDIS_URL: "redis://redis:6379/0"
      AP_DOCKER_NETWORK: ${AP_DOCKER_NETWORK:-deploy_default}
      AP_TEMPORAL_HOST: "temporal:7233"
      AP_TEMPORAL_NAMESPACE: "default"
      AP_TEMPORAL_TASK_QUEUE: "ap-messages"
      DATABASE_URL: postgresql+asyncpg://ap:${POSTGRES_PASSWORD}@postgres:5432/agent_playground_api
      AP_CHANNEL_MASTER_KEY: ${AP_CHANNEL_MASTER_KEY}
    env_file:
      - .env.prod
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../recipes:/app/recipes:ro

  api_server:
    build:
      context: ..
      dockerfile: tools/Dockerfile.api
      args:
        DOCKER_GID: ${DOCKER_GID:-999}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      AP_ENV: prod
      AP_TRUSTED_PROXY: "true"
      AP_MAX_CONCURRENT_RUNS: "2"
      AP_RECIPES_DIR: /app/recipes
      # Phase 22c.3 (D-08): Redis Pub/Sub URL — compose-internal hostname
      # (the `redis` service above). The outbox pump publishes here; the
      # SSE handler subscribes here. No host port; no public exposure.
      AP_REDIS_URL: "redis://redis:6379/0"
      # Pin spawned agent containers onto deploy_default so api_server's
      # inapp_dispatcher can resolve their NetworkSettings.Networks[<name>].IPAddress
      # for HTTP forwarding. Without this they default to the host's bridge
      # network and the dispatcher's get_container_ip() raises ip_lookup_failed.
      AP_DOCKER_NETWORK: ${AP_DOCKER_NETWORK:-deploy_default}
      # NOTE: password is injected via env_file (.env.prod) so the secret never
      # appears in compose config output or `docker inspect`. deploy.sh writes
      # .env.prod from secrets/pg_password at deploy time.
      DATABASE_URL: postgresql+asyncpg://ap:${POSTGRES_PASSWORD}@postgres:5432/agent_playground_api
      # Phase 22-02: channel credential encryption master key (32 bytes base64).
      # Sourced from .env.prod via env_file below. When unset AND AP_ENV=prod,
      # the crypto module raises on first use (fail-loud). In dev (AP_ENV=dev)
      # the helper falls back to 32 zero bytes — never ship that fallback.
      AP_CHANNEL_MASTER_KEY: ${AP_CHANNEL_MASTER_KEY}
    env_file:
      - .env.prod
    # Phase B UAT (2026-05-09) — see same note on temporal-worker above.
    # Docker Desktop on macOS forces 0:0 ownership inside the container.
    # Linux deploys treat this as a no-op (DOCKER_GID already grants access).
    group_add: ["0"]
    volumes:
      # ACCEPTED trust boundary (D-08) — runner shells out to `docker` CLI.
      - /var/run/docker.sock:/var/run/docker.sock
      - ../recipes:/app/recipes:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data              # Pitfall 7 — persistent ACME cert storage
      - caddy_config:/config
    depends_on:
      - api_server

volumes:
  pgdata:
  caddy_data:
  caddy_config:

secrets:
  pg_password:
    file: ./secrets/pg_password
