# Local-only override for prod-shaped boot on a developer laptop.
# Adds host port mapping for api_server so we can hit it directly without Caddy
# (Caddy needs a real DNS name + port 80/443 + Let's Encrypt; not for local).
#
# Use:  docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.local.yml up -d postgres api_server
# Skip the caddy service entirely.

services:
  api_server:
    ports:
      - "127.0.0.1:8000:8000"
    # macOS-only workaround: Docker Desktop bind-mounts /var/run/docker.sock as root:root mode 660.
    # On Linux Hetzner the socket is root:docker (gid 999) and apiuser (in docker group) can access it.
    # Run as root locally only — DO NOT apply this override on the prod box.
    user: root
    # Phase 22b-08: AP_ENV=dev unlocks dev-only routes (notably
    # POST /v1/agents/:id/events/inject-test-event for SC-03 Gate B).
    # Production stays AP_ENV=prod via docker-compose.prod.yml; this
    # override only applies when the local file is layered in. Leaves
    # /docs + /redoc visible too (per D-10) which is desirable on a dev
    # laptop. NEVER apply this override on the prod Hetzner box.
    environment:
      AP_ENV: dev

  redis:
    # Phase 22c.3 local override: expose redis on 127.0.0.1:6379 so host-
    # venv tests (per CONTEXT.md line 299) can hit it via
    # AP_REDIS_URL=redis://localhost:6379/0. Compose-internal name `redis`
    # still works for the api_server container; this just adds a host
    # path. NEVER apply on the prod box — the prod compose has no ports
    # block on redis (D-08 loopback-only inside compose net).
    ports:
      - "127.0.0.1:6379:6379"

  # Phase 28 local override: expose Temporal frontend on 127.0.0.1:7233 so a
  # host-venv test/script can dial the cluster directly. Compose-internal
  # `temporal:7233` continues to work for in-stack services. NEVER apply on
  # the prod box — the prod compose has no `ports` block on the temporal
  # service (it's loopback-only inside the compose net per D-03).
  #
  # NOTE: there is intentionally NO override for temporal-worker here. The
  # worker MUST stay inside compose on macOS — it resolves agent containers
  # by Docker bridge IP, and macOS Docker Desktop does not route from host
  # to the bridge network (RESEARCH §7 R6, see deploy/README.md "Phase 28 —
  # Temporal worker on macOS"). A host-venv worker hits
  # `inapp_dispatcher.ip_lookup_failed` symptoms.
  temporal:
    ports:
      - "127.0.0.1:7233:7233"

  temporal-worker:
    # macOS-only workaround (matches the api_server `user: root` override on
    # lines 12-15): Docker Desktop bind-mounts /var/run/docker.sock as
    # root:root mode 660; the apiuser inside the image gets Permission
    # denied calling docker.from_env(). On Linux Hetzner the socket is
    # root:docker(gid 999) and apiuser is in that group, so this override
    # is local-only. Wave 0 spike C verified this empirically (see
    # 28-01-SPIKE-EVIDENCE.md and memory/feedback_check_msv_when_stuck.md).
    user: root
