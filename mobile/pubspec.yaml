name: agent_playground
description: "Solvr Labs agent playground mobile app"
publish_to: 'none'
version: 0.2.0+9

environment:
  sdk: ^3.9.0
  flutter: ">=3.41.0"

dependencies:
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_appauth: ^12.0.0
  flutter_client_sse: ^2.0.3
  flutter_inappwebview: ^6.1.5   # AMD-03 — Stripe Checkout webview + shouldOverrideUrlLoading interception
  flutter_markdown_plus: ^1.0.0   # AMD-03 — replaces discontinued flutter_markdown
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.0.0
  flutter_web_auth_2: ^5.0.2   # 2026-05-12 — GitHub OAuth: flutter_appauth's PendingIntent same-task assumption breaks on HyperOS App Link dispatch; flutter_web_auth_2 uses a simpler callback activity that doesn't have that constraint
  go_router: ^17.2.3
  google_fonts: ^8.1.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.0.0   # 2026-05-12 — iOS Sign in with Apple (App Store Guideline 4.8 compliance)
  intl: ^0.20.0   # D-47 — DateFormat for inline timestamp dividers
  riverpod_annotation: ^4.0.2
  sentry_flutter: ^9.20.0   # Phase 31 H6 (D-11) — errors-only mobile Sentry; auto no-op when SENTRY_DSN_MOBILE dart-define empty
  url_launcher: ^6.3.0   # D-46 — chat markdown link tap (https/http allow-list)
  uuid: ^4.5.3

dev_dependencies:
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.4   # generate iOS + Android app icons from assets/app_icon.png
  flutter_test:
    sdk: flutter
  golden_toolkit: ^0.15.0   # D-62 — snapshot tests at textScaleFactor 1.0/1.5/2.0
  http_mock_adapter: ^0.6.1
  integration_test:
    sdk: flutter
  riverpod_generator: ^4.0.3
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/app_icon.png"
  ios: true
  remove_alpha_ios: true   # Apple rejects iOS icons with alpha
  android: true
  adaptive_icon_background: "#FAFAFA"   # match Solvr off-white
  adaptive_icon_foreground: "assets/app_icon.png"
